<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Realty Agent · 线索情报看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="/css/base.css" rel="stylesheet">
<link href="/css/modal.css" rel="stylesheet">
<link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <a href="/" class="sidebar-logo-title">Realty<span>Agent</span></a>
      <div class="sidebar-logo-sub">线索情报</div>
    </div>
    <nav class="sidebar-nav">
      <a class="sidebar-link active" href="/"><span class="sidebar-link-icon">📊</span> 看板</a>
      <a class="sidebar-link" href="/bot.html"><span class="sidebar-link-icon">🤖</span> Bot</a>
    </nav>
    <div class="sidebar-section">客户分组</div>
    <div id="groupList"></div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="main-content">
    <header class="top-bar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <span class="top-bar-title">线索情报看板</span>
      </div>
      <div class="top-bar-actions">
        <span class="top-bar-timestamp">上次同步: <span id="lastSync">—</span></span>
        <div class="env-group" id="envGroup">
          <div class="env-pill checking" id="envWechat">💬<span class="env-tip">检测中...</span></div>
          <div class="env-pill checking" id="envDb">🗄️<span class="env-tip">检测中...</span></div>
          <div class="env-pill checking" id="envFeishu">📋<span class="env-tip">检测中...</span></div>
          <div class="env-pill checking" id="envLlm">🤖<span class="env-tip">检测中...</span></div>
        </div>
        <button class="btn btn-ghost" onclick="window._openSyncModal()">🔄 同步</button>
      </div>
    </header>

    <div class="page-body">
      <!-- KPI Cards -->
      <div class="kpi-grid">
        <a class="kpi-card green clickable" href="/detail.html?cat=active">
          <span class="kpi-icon">🟢</span>
          <div class="kpi-value" id="kpiActive">—</div>
          <div class="kpi-label">活跃客户</div>
        </a>
        <a class="kpi-card gold clickable" href="/detail.html?cat=messages">
          <span class="kpi-icon">💬</span>
          <div class="kpi-value" id="kpiNewMsg">—</div>
          <div class="kpi-label">新消息</div>
        </a>
        <a class="kpi-card amber clickable" href="/detail.html?cat=pending">
          <span class="kpi-icon">⚠️</span>
          <div class="kpi-value" id="kpiPending">—</div>
          <div class="kpi-label">待回复</div>
        </a>
        <a class="kpi-card blue clickable" href="/detail.html?cat=silent">
          <span class="kpi-icon">❄️</span>
          <div class="kpi-value" id="kpiSilent">—</div>
          <div class="kpi-label">沉默客户</div>
        </a>
      </div>

      <!-- Briefing -->
      <div class="briefing" id="briefingCard">
        <div class="briefing-header" onclick="window._toggleBriefing()">
          <div class="briefing-title-wrap">
            <span class="briefing-label">Briefing Note</span>
            <span class="briefing-date" id="briefingDate"></span>
          </div>
          <span class="briefing-chevron">▼</span>
        </div>
        <div class="briefing-body">
          <div class="briefing-content" id="briefingContent">加载中...</div>
          <div style="padding:0 16px 14px">
            <button class="btn btn-sm btn-ghost" onclick="window._copyBriefing()">📋 复制摘要</button>
          </div>
        </div>
      </div>

      <!-- Three Columns -->
      <div class="columns-3">
        <div class="column-panel">
          <div class="column-header">
            <span class="column-title green">最值得关注</span>
            <span class="column-count" id="notableCount">—</span>
          </div>
          <div class="column-body" id="notableList"><div class="empty-state">加载中...</div></div>
        </div>
        <div class="column-panel">
          <div class="column-header">
            <span class="column-title amber">可行动项</span>
            <span class="column-count" id="actionCount">—</span>
          </div>
          <div class="column-body" id="actionList"><div class="empty-state">加载中...</div></div>
        </div>
        <div class="column-panel">
          <div class="column-header">
            <span class="column-title blue">情报源</span>
            <span class="column-count" id="sourceCount">—</span>
          </div>
          <div class="column-body" id="sourceList"><div class="empty-state">加载中...</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Sync Modal -->
<div class="modal-overlay" id="syncModal" style="display:none" onclick="if(event.target===this)window._closeSyncModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">同步微信消息</span>
      <button class="modal-close" onclick="window._closeSyncModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <div class="form-label">同步方式</div>
        <div class="radio-group">
          <label class="radio-label checked"><input type="radio" name="syncMode" value="now" checked onchange="window._updateSyncRadioUI()"><span class="radio-dot"></span>立即同步</label>
          <label class="radio-label"><input type="radio" name="syncMode" value="schedule" onchange="window._updateSyncRadioUI()"><span class="radio-dot"></span>创建定时同步</label>
        </div>
      </div>
      <div id="syncDateFields">
        <div class="form-group">
          <div class="form-label">消息时间范围</div>
          <div class="form-row">
            <div class="form-group"><input type="date" class="form-input" id="syncDateStart"></div>
            <div class="form-group"><input type="date" class="form-input" id="syncDateEnd"></div>
          </div>
          <div class="form-hint">留空则同步全部消息</div>
        </div>
      </div>
      <div id="syncScheduleFields" style="display:none">
        <div class="form-group">
          <div class="form-label">执行时间</div>
          <div class="form-row">
            <div class="form-group"><input type="time" class="form-input" id="syncScheduleTime" value="22:30"></div>
            <div class="form-group">
              <select class="form-select" id="syncScheduleFreq">
                <option value="daily">每天</option>
                <option value="weekday">工作日</option>
                <option value="weekly">每周一</option>
              </select>
            </div>
          </div>
        </div>
        <div class="form-group">
          <div class="form-label">同步消息范围（可选）</div>
          <div class="form-row">
            <div class="form-group"><input type="date" class="form-input" id="syncScheduleDateStart"></div>
            <div class="form-group"><input type="date" class="form-input" id="syncScheduleDateEnd"></div>
          </div>
          <div class="form-hint">留空则同步当日消息</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="window._closeSyncModal()">取消</button>
      <button class="btn btn-primary" id="syncSubmitBtn" onclick="window._submitSync()">开始同步</button>
    </div>
  </div>
</div>

<!-- Group Create Modal -->
<div class="modal-overlay" id="groupModal" style="display:none" onclick="if(event.target===this)window._closeGroupModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">新建分组</span>
      <button class="modal-close" onclick="window._closeGroupModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <div class="form-label">分组名称</div>
        <input type="text" class="form-input" id="groupNameInput" placeholder="例如：投资客户" onkeydown="if(event.key==='Enter')window._submitNewGroup()">
      </div>
      <div class="form-group">
        <div class="form-label">颜色</div>
        <div style="display:flex;align-items:center;gap:10px">
          <div id="groupColorPreview" style="width:24px;height:24px;border-radius:6px;background:#8b5cf6"></div>
          <input type="color" id="groupColorInput" value="#8b5cf6" style="width:0;height:0;opacity:0;position:absolute">
          <button class="btn btn-sm btn-ghost" onclick="document.getElementById('groupColorInput').click();document.getElementById('groupColorInput').onchange=function(){document.getElementById('groupColorPreview').style.background=this.value}">选择颜色</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="window._closeGroupModal()">取消</button>
      <button class="btn btn-primary" onclick="window._submitNewGroup()">创建</button>
    </div>
  </div>
</div>

<!-- Action Reply Modal -->
<div class="modal-overlay" id="actionModal" style="display:none" onclick="if(event.target===this)window._closeActionModal()">
  <div class="modal" style="width:min(32rem,92vw)">
    <div class="modal-header">
      <span class="modal-title">✉️ 生成回复话术</span>
      <button class="modal-close" onclick="window._closeActionModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="action-modal-context">
        <div class="action-modal-customer" id="actionCustomer">—</div>
        <div class="action-modal-situation" id="actionSituation">—</div>
      </div>
      <div class="action-modal-draft-label">AI 生成的话术（可编辑）</div>
      <textarea class="action-modal-textarea" id="actionDraft" rows="4"></textarea>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
        <button class="btn btn-sm btn-ghost" onclick="window._regenerateDraft()">🔄 重新生成</button>
        <span id="actionStatus" style="font-size:12px;color:var(--text-muted)"></span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="window._closeActionModal()">取消</button>
      <button class="btn btn-primary" id="actionSendBtn" onclick="window._sendActionReply()">发送</button>
    </div>
  </div>
</div>

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
</script>
<script type="module">
  import { initDashboard } from './js/dashboard.js';
  initDashboard();
</script>
</body>
</html>
