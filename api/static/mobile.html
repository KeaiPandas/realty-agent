<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1f">
<title>Realty Agent · 移动端</title>
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title">Realty <span class="dot">·</span> Agent</div>
    <div class="actions">
      <span class="demo-badge" id="demoBadge">演示数据</span>
      <span class="ico" onclick="refreshAll()" title="刷新">&#8635;</span>
    </div>
  </div>

  <div class="screen">
    <section class="view active" id="view-board">
      <div class="kpi-grid" id="kpiGrid"></div>
      <div class="section-label">今日情报简报</div>
      <div id="briefWrap"></div>
      <div class="section-label">紧急待办 <span class="more" onclick="switchTo('leads')">客户库 &#8250;</span></div>
      <div id="todoWrap"></div>
      <div class="section-label">高优先线索</div>
      <div id="riskWrap"></div>
    </section>

    <section class="view" id="view-leads">
      <div class="chips" id="catChips"></div>
      <div id="leadsWrap"></div>
    </section>

    <section class="view" id="view-bot">
      <div class="section-label">Bot 状态 <span class="more" id="botModeLabel"></span></div>
      <div class="kpi-grid" id="botKpi"></div>
      <div class="section-label">待审批回复</div>
      <div id="botWrap"></div>
    </section>
  </div>

  <div class="sheet" id="sheet">
    <div class="shead"><span class="back ico" onclick="closeDetail()">&#8249;</span><span class="st">客户画像</span></div>
    <div class="sbody" id="sheetBody"></div>
  </div>

  <nav class="nav">
    <a class="on" data-v="board" onclick="switchView(this)"><span class="ic ico">&#9632;</span>看板</a>
    <a data-v="leads" onclick="switchView(this)"><span class="ic ico">&#9783;</span>客户</a>
    <div class="fab"><div class="b ico" onclick="toast('同步需在电脑端触发,手机端仅查看')">&#8635;</div></div>
    <a data-v="bot" onclick="switchView(this)"><span class="ic ico">&#9993;</span>Bot</a>
    <a data-v="me" onclick="toast('我的 / 设置(待开发)')"><span class="ic ico">&#9737;</span>我的</a>
  </nav>
  <div class="toast" id="toast"></div>
</div>

<script src="js/mobile.js"></script>
</body>
</html>
